name: Build Fat JAR

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile
        run: |
          mkdir -p out
          javac -encoding UTF-8 -cp "lib/guava-32.1.3-jre.jar:lib/failureaccess-1.0.2.jar" -d out \
            *.java rng/*.java trade/*.java enchant/*.java functions/*.java mode/*.java io/*.java util/*.java

      - name: Extract dependencies into out/
        run: |
          cd out
          jar xf ../lib/guava-32.1.3-jre.jar
          jar xf ../lib/failureaccess-1.0.2.jar
          rm -rf META-INF/*.SF META-INF/*.RSA META-INF/*.DSA
          cd ..

      - name: Bundle lang files
        run: cp -r lang out/lang

      - name: Create MANIFEST
        run: |
          echo 'Main-Class: Main' > MANIFEST.MF

      - name: Package fat JAR
        run: jar cfm TradePredictor261.jar MANIFEST.MF -C out .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradePredictor261
          path: TradePredictor261.jar

